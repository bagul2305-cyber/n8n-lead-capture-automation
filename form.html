<!DOCTYPE html>
<html>
    <head><title>Contact form</title></head>
    <body>
        <h2>Contact us</h2>
        <form id="leadform">
            <input type="text" id="name" placeholder="Your name" required/><br/><br/>
            <input type="email" id="email" placeholder="Your email" required/><br/><br/>
            <textarea id="message" placeholder="Your message" required></textarea><br/><br/>
            <button type="submit">Submit</button>
        </form>
        <p id="status"></p>
        <script>
            document.getElementById('leadform').addEventListener('submit', async function (e) {
                e.preventDefault();
                const data = {
                    name:
                document.getElementById('name').value,
                    email:
                document.getElementById('email').value,
                    message:
                document.getElementById('message').value
                    };
                    const res = await
                fetch('http://localhost:5678/webhook/lead-form2',{
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(data) 
                   });
                document.getElementById('status').textContent=
                res.ok? 'Submitted!':'Error. Try again';
                 });
        </script>
    </body>
</html>
